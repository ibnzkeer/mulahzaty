<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملاحظاتي — دفتر ملاحظاتك الشخصي</title>
  <meta name="description" content="ملاحظاتي: تطبيق ملاحظات شخصي آمن، بياناتك محفوظة محلياً ومرتبطة بحسابك." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
</head>
<body>
  <!-- Auth View -->
  <div id="authView" class="auth-view">
    <button class="icon-btn auth-theme-toggle" id="authThemeToggleBtn" title="تبديل المظهر" aria-label="تبديل المظهر">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div class="auth-bg">
      <div class="auth-blob auth-blob-1"></div>
      <div class="auth-blob auth-blob-2"></div>
      <div class="auth-blob auth-blob-3"></div>
    </div>
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h1>ملاحظاتي</h1>
        <p>دفتر ملاحظاتك الشخصي والأمن</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">تسجيل الدخول</button>
        <button class="auth-tab" data-tab="register">إنشاء حساب</button>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="loginEmail">البريد الإلكتروني</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="loginEmail" placeholder="example@email.com" required autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label for="loginPassword">كلمة المرور</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" data-target="loginPassword" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="loginError" class="form-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <span>دخول</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <form id="registerForm" class="auth-form hidden" novalidate>
        <div class="field">
          <label for="regName">الاسم</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="regName" placeholder="اسمك" required autocomplete="name" />
          </div>
        </div>
        <div class="field">
          <label for="regEmail">البريد الإلكتروني</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="regEmail" placeholder="example@email.com" required autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label for="regPassword">كلمة المرور</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" required autocomplete="new-password" minlength="6" />
            <button type="button" class="toggle-pw" data-target="regPassword" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="regPassword2">تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPassword2" placeholder="••••••••" required autocomplete="new-password" />
          </div>
        </div>
        <div id="registerError" class="form-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <span>إنشاء حساب</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </button>
      </form>

      <div class="auth-footer">
        <span>بياناتك محفوظة محلياً على جهازك ولا تُرسل لأي خادم.</span>
      </div>
    </div>
  </div>

  <!-- App View -->
  <div id="appView" class="app-view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-small">
          <div class="brand-mark small">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <span>ملاحظاتي</span>
        </div>
      </div>
      <div class="topbar-center">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="searchInput" placeholder="بحث في الملاحظات..." />
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-chip" id="userChip">
          <div class="user-avatar" id="userAvatar">م</div>
          <span id="userName">مستخدم</span>
        </div>
        <button class="icon-btn" id="themeToggleBtn" title="تبديل المظهر" aria-label="تبديل المظهر">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 0-2 2V5a2 2 0 0 0 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>ملاحظاتي</h2>
          <button class="btn btn-primary btn-sm" id="newNoteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>جديدة</span>
          </button>
        </div>
        <div class="notes-list" id="notesList"></div>
        <div class="sidebar-footer" id="notesCount"></div>
      </aside>

      <main class="editor-area" id="editorArea">
        <div class="empty-state" id="emptyState">
          <div class="empty-illustration">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <h3>لا توجد ملاحظة محددة</h3>
          <p>أنشئ ملاحظة جديدة أو اختر واحدة من القائمة.</p>
          <button class="btn btn-primary" id="emptyNewBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>ملاحظة جديدة</span>
          </button>
        </div>

        <div class="editor hidden" id="editor">
          <div class="editor-toolbar">
            <div class="toolbar-left">
              <span class="save-status" id="saveStatus">محفوظ</span>
            </div>
            <div class="toolbar-right">
              <button class="icon-btn" id="pinBtn" title="تثبيت" aria-label="تثبيت">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>
              </button>
              <div class="color-picker" id="colorPicker">
                <button class="color-dot selected" data-color="" title="افتراضي" style="background: var(--surface); border: 2px solid var(--border);"></button>
                <button class="color-dot" data-color="#fef3c7" title="أصفر" style="background:#fef3c7;"></button>
                <button class="color-dot" data-color="#dcfce7" title="أخضر" style="background:#dcfce7;"></button>
                <button class="color-dot" data-color="#dbeafe" title="أزرق" style="background:#dbeafe;"></button>
                <button class="color-dot" data-color="#fce7f3" title="وردي" style="background:#fce7f3;"></button>
                <button class="color-dot" data-color="#ede9fe" title="بنفسجي" style="background:#ede9fe;"></button>
              </div>
              <button class="icon-btn danger" id="deleteBtn" title="حذف" aria-label="حذف">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 0-2 2H7a2 2 0 0 0-2-2V6m3 0V4a2 2 0 0 0 2-2h4a2 2 0 0 0 2 2v2"/></svg>
              </button>
            </div>
          </div>
          <input type="text" id="noteTitle" class="note-title-input" placeholder="عنوان الملاحظة" />
          <textarea id="noteContent" class="note-content" placeholder="ابدأ بكتابة ملاحظتك هنا..."></textarea>
          <div class="editor-meta" id="editorMeta"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
